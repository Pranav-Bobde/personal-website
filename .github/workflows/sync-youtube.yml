name: Sync YouTube videos

on:
  schedule:
    - cron: "0 18 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORS_ORIGIN: https://pranavb.xyz
      VITE_SITE_URL: https://pranavb.xyz
      VITE_POSTHOG_HOST: https://us.i.posthog.com
      VITE_POSTHOG_UI_HOST: https://us.posthog.com
      VITE_POSTHOG_TOKEN: build-only-placeholder
      VITE_NEWSLETTER_URL: https://pranav-bobde.kit.com/58ca1bcb46
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reconcile YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: bun run --cwd apps/web sync-youtube

      - name: Test video data
        run: bun run --cwd apps/web test:youtube-sync

      - name: Verify repository
        run: bun run verify

      - name: Commit generated data when changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- apps/web/src/generated/youtube-videos.json apps/web/public/video-previews/youtube
          if git diff --cached --quiet; then
            echo "No generated YouTube changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "chore: sync YouTube videos"
          git push origin "HEAD:${TARGET_BRANCH}"
